stages:
  converte_tse:
    foreach: ${anos}
    do:
      cmd: python -m kingsrace.ingest.tse ${item}
      deps:
        - src/kingsrace/ingest/tse.py
        - data/raw/tse/votacao_secao/votacao_secao_${item}_BR.zip
        - data/raw/tse/detalhe_votacao_munzona/detalhe_votacao_munzona_${item}.zip
      outs:
        # intermediários: reconstruíveis, não vão para o cache nem para o R2
        - data/interim/tse/votacao_secao/ano=${item}:
            cache: false
        - data/interim/tse/detalhe_munzona/ano=${item}:
            cache: false

  municipios:
    cmd: python -m kingsrace.harmonize.municipios
    deps:
      - src/kingsrace/harmonize/municipios.py
      - data/raw/ibge/municipios.json
      - data/reference/municipios_overrides.csv
      - data/reference/amc.csv
      - data/interim/tse/detalhe_munzona
    outs:
      - data/processed/municipios.parquet

  painel:
    cmd: python -m kingsrace.features.painel
    deps:
      - src/kingsrace/features/painel.py
      - data/reference/candidatos.csv
      - data/reference/voto_transito_2010.csv
      - data/processed/municipios.parquet
      - data/interim/tse/votacao_secao
      - data/interim/tse/detalhe_munzona
    outs:
      - data/processed/votos_municipio.parquet
      - data/processed/painel_municipio.parquet
      - data/processed/painel_amc.parquet

  covariaveis:
    cmd: python -m kingsrace.features.covariaveis
    deps:
      - src/kingsrace/ingest/ibge.py
      - src/kingsrace/ingest/mds.py
      - src/kingsrace/features/covariaveis.py
      - data/raw/ibge/sidra
      - data/raw/mds
      - data/processed/municipios.parquet
    outs:
      - data/processed/covariaveis_municipio.parquet
      - data/processed/covariaveis_amc.parquet
